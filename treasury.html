<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AfriSnacks Treasury | Access Bank Prototype</title>
<style>
:root{--navy:#002A5C;--deep:#001C3D;--panel:#0A376B;--orange:#F58220;--green:#45C979;--white:#fff;--text:#EEF4FA;--muted:#AEBED0;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:#061727;color:var(--text)}button{font:inherit}
.app{min-height:100vh}.sidebar{position:fixed;width:255px;height:100vh;background:linear-gradient(180deg,var(--deep),#00142D);padding:24px 15px;border-right:1px solid var(--line);z-index:10}.brand{display:flex;gap:12px;align-items:center;margin:5px 10px 34px}.mark{width:33px;height:25px;position:relative}.mark:before,.mark:after{content:"";position:absolute;transform:rotate(45deg);border:3px solid var(--orange)}.mark:before{width:17px;height:17px;top:3px}.mark:after{width:9px;height:9px;left:6px;top:7px;background:var(--deep)}.brand h2{font-size:18px}.brand p{font-size:10px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:1px}.nav-btn{width:100%;border:0;background:transparent;color:#C6D2DF;padding:13px 15px;text-align:left;border-radius:8px;margin-bottom:5px;cursor:pointer}.nav-btn:hover,.nav-btn.active{background:#123F73;color:white}.nav-btn.active{border-left:3px solid var(--orange)}.statusbox{position:absolute;left:20px;right:20px;bottom:24px;padding:14px;background:rgba(255,255,255,.05);border-radius:10px;font-size:12px;color:var(--muted)}.statusbox b{display:block;color:white;margin-bottom:7px}.green{color:var(--green)}.orange{color:var(--orange)}
.main{margin-left:255px;min-height:100vh}.topbar{height:72px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#071A2B;position:sticky;top:0;z-index:5}.user{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);display:grid;place-items:center;color:var(--deep);font-weight:bold}.content{padding:32px;max-width:1600px}
h1{font-size:32px;margin-bottom:8px}h2{font-size:21px}h3{font-size:16px}p{color:var(--muted);line-height:1.55}.card{background:#102A45;border:1px solid var(--line);border-radius:18px}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.btn{border:0;background:var(--orange);color:#071A2B;padding:13px 18px;border-radius:9px;font-weight:bold;cursor:pointer}.hero-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;margin-bottom:20px}.hero{padding:42px;background:radial-gradient(circle at 85% 10%,#175487,transparent 35%),#0B315A;min-height:275px}.eyebrow{color:var(--orange);font-size:12px;font-weight:bold;letter-spacing:1.3px}.hero h1{font-size:45px;max-width:620px;margin:16px 0}.liquidity{padding:35px;display:flex;justify-content:center;flex-direction:column}.label{font-size:12px;color:var(--muted);letter-spacing:.5px}.big{font-size:39px;font-weight:bold;margin:12px 0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.kpi{padding:20px}.kpi .value{font-size:25px;font-weight:bold;margin:10px 0}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.pad{padding:24px}
.chart-tabs{display:flex;gap:8px;margin:16px 0}.tab{padding:8px 12px;border-radius:7px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:12px}.tab.active{background:var(--orange);border-color:var(--orange);color:#061727;font-weight:bold}.chartwrap{height:290px;position:relative;margin-top:8px}.chartwrap svg{width:100%;height:100%;overflow:visible}.gridline{stroke:rgba(255,255,255,.1);stroke-width:1}.forecast-line{fill:none;stroke:#45C979;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.area{fill:url(#fill);opacity:.32}.dot{fill:var(--orange);stroke:#fff;stroke-width:2}.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:5px}
.balance{display:grid;grid-template-columns:85px 1fr 75px;gap:12px;align-items:center;margin:19px 0;color:#D8E2EC;font-size:13px}.bar{height:8px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:var(--orange);border-radius:99px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{text-align:left;padding:14px 10px;border-top:1px solid var(--line);font-size:13px;color:#C9D6E3}.table th{color:var(--muted);font-size:11px}.badge{display:inline-block;padding:6px 10px;border-radius:99px;font-size:11px;background:rgba(69,201,121,.12);color:var(--green)}.pending{background:rgba(245,130,32,.12);color:var(--orange)}
.settlement{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:24px;padding:34px}.party{padding:24px;text-align:center;background:#0D2742;border:1px solid var(--line);border-radius:14px}.route{text-align:center}.routebar{height:5px;background:linear-gradient(90deg,var(--orange),#FFB36B,var(--orange));margin:20px 0;border-radius:9px}.workflow{display:flex;justify-content:space-between;gap:10px;padding:35px 18px;position:relative}.step{flex:1;text-align:center}.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:#183A60;color:var(--muted);font-weight:bold}.done .circle{background:var(--green);color:#06203A}.active .circle{background:var(--orange);color:#06203A}.step p{font-size:12px;margin-top:6px}
.impact{display:grid;grid-template-columns:1fr 120px 1fr;gap:18px;align-items:center}.impactcard{text-align:center;padding:32px}.arrow{text-align:center;font-size:45px;color:var(--green)}
.menu-toggle{display:none;background:transparent;color:white;border:1px solid var(--line);padding:8px;border-radius:7px}
@media(max-width:950px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.menu-toggle{display:block}.kpis{grid-template-columns:repeat(2,1fr)}.hero-grid,.grid2{grid-template-columns:1fr}.settlement{grid-template-columns:1fr}.statusbox{display:none}.sidebar{width:270px}}
@media(max-width:600px){.topbar{padding:0 16px}.topbar .crumb{display:none}.content{padding:20px 14px}h1{font-size:27px}.hero{padding:30px 22px}.hero h1{font-size:34px}.kpis{grid-template-columns:1fr}.pagehead{align-items:flex-start;gap:15px}.pagehead .btn{white-space:nowrap}.balance{grid-template-columns:72px 1fr 60px}.workflow{overflow-x:auto;justify-content:flex-start}.step{min-width:150px}.impact{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}.user span{display:none}}
</style>
</head>
<body><div id="app"></div>
<script>
const app=document.getElementById('app');
const pages={mission:'Mission Control',cash:'Cash Management',papss:'Payments & FX',supply:'Supply Chain Finance',distributor:'Distributor Profile',journey:'Financing Journey',impact:'Treasury Impact'};
let current='mission',forecastDays=7;
function layout(content){app.innerHTML=`<div class="app"><aside class="sidebar" id="side"><div class="brand"><div class="mark"></div><div><h2>AfriSnacks</h2><p>Digital Command Centre</p></div></div>${Object.entries(pages).map(([id,n])=>`<button class="nav-btn ${current===id?'active':''}" onclick="go('${id}')">${n}</button>`).join('')}<div class="statusbox"><b>● System Status</b><span class="green">All Systems Operational</span></div></aside><main class="main"><header class="topbar"><button class="menu-toggle" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div class="crumb">AfriSnacks Digital Command Centre</div><div class="user"><span>Executive Treasury</span><div class="avatar">AT</div></div></header><section class="content">${content}</section></main></div>`}
function go(p){current=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function forecast(){const d=forecastDays===7?{pts:'0,220 65,180 130,205 195,130 260,155 325,90 390,118 455,55 520,75 585,30 650,48',area:'0,290 0,220 65,180 130,205 195,130 260,155 325,90 390,118 455,55 520,75 585,30 650,48 650,290',labels:'Today · Day 1 · Day 2 · Day 3 · Day 4 · Day 5 · Day 6'}:{pts:'0,220 22,195 44,235 66,170 88,205 110,140 132,165 154,120 176,150 198,100 220,135 242,80 264,115 286,155 308,105 330,135 352,70 374,98 396,125 418,62 440,92 462,48 484,85 506,115 528,55 550,88 572,38 594,72 616,30 650,58',area:'0,290 0,220 22,195 44,235 66,170 88,205 110,140 132,165 154,120 176,150 198,100 220,135 242,80 264,115 286,155 308,105 330,135 352,70 374,98 396,125 418,62 440,92 462,48 484,85 506,115 528,55 550,88 572,38 594,72 616,30 650,58 650,290',labels:'Today · 5D · 10D · 15D · 20D · 25D · 30D'};return `<div class="chart-tabs"><button class="tab ${forecastDays===7?'active':''}" onclick="setForecast(7)">7 Days</button><button class="tab ${forecastDays===30?'active':''}" onclick="setForecast(30)">30 Days</button></div><div class="chartwrap"><svg viewBox="0 0 650 290" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#45C979"/><stop offset="1" stop-color="#45C979" stop-opacity="0"/></linearGradient></defs><line class="gridline" x1="0" y1="50" x2="650" y2="50"/><line class="gridline" x1="0" y1="120" x2="650" y2="120"/><line class="gridline" x1="0" y1="190" x2="650" y2="190"/><polygon class="area" points="${d.area}"/><polyline class="forecast-line" points="${d.pts}"/><circle class="dot" cx="650" cy="${forecastDays===7?48:58}" r="6"/></svg></div><div class="legend"><span>Projected liquidity movement</span><span>${d.labels}</span></div>`}
function setForecast(n){forecastDays=n;current='cash';render()}
function mission(){layout(`<div class="hero-grid"><div class="card hero"><div class="eyebrow">AFRICA-WIDE TREASURY VISIBILITY</div><h1>Run Africa from One Command Centre.</h1><p>Real-time visibility. Smarter liquidity. Stronger supply chains.</p><button class="btn" style="margin-top:24px" onclick="go('cash')">Explore Treasury →</button></div><div class="card liquidity"><div class="label">TOTAL LIQUIDITY</div><div class="big green">$48.62M</div><p>Available across all regional accounts</p><p class="green" style="margin-top:15px">↑ 3.61% vs yesterday</p></div></div><div class="kpis">${[['COLLECTIONS TODAY','₦18.2M','↑ 12.4%'],['PAPSS SETTLEMENT','Active','Real-time settlement'],['DISTRIBUTOR NETWORK','1,200','Active distributors'],['CURRENCIES','12','Supported currencies']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><span class="${x[2].includes('↑')?'green':''}">${x[2]}</span></div>`).join('')}</div><div class="grid2"><div class="card pad"><h2>Cash Management Solution</h2><p style="margin:10px 0 20px">Centralised visibility across collections, liquidity and regional cash positions.</p><button class="btn" onclick="go('cash')">Open Cash Management →</button></div><div class="card pad"><h2>Supply Chain Finance</h2><p style="margin:10px 0 20px">Unlock distributor working capital while keeping treasury in control.</p><button class="btn" onclick="go('supply')">Open Supply Chain Finance →</button></div></div>`)}
function cash(){layout(`<div class="pagehead"><div><h1>Cash Management</h1><p>Real-time liquidity and collections intelligence.</p></div><button class="btn">Create Payment</button></div><div class="kpis">${[['LIQUIDITY','$48.62M','↑ 3.61%'],['COLLECTIONS','₦18.2M','↑ 12.4%'],['CASH CONCENTRATION','82%','↑ 5%'],['REGIONS','5','Active markets']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><span class="${x[2].includes('↑')?'green':''}">${x[2]}</span></div>`).join('')}</div><div class="grid2"><div class="card pad"><h2>Liquidity Forecast</h2><p>Forecast movement fluctuates by selected time horizon.</p>${forecast()}</div><div class="card pad"><h2>Regional Balances</h2>${[['Nigeria','82%','$24.3M'],['Ghana','60%','$9.8M'],['Kenya','48%','$7.1M'],['Rwanda','28%','$4.5M']].map(x=>`<div class="balance"><span>${x[0]}</span><div class="bar"><span style="width:${x[1]}"></span></div><b>${x[2]}</b></div>`).join('')}</div></div>`)}
function papss(){layout(`<div class="pagehead"><div><h1>Payments & FX</h1><p>Real-time cross-border treasury settlement.</p></div></div><div class="card settlement"><div class="party"><h2>🇰🇪 Kenya Treasury</h2><p>Regional treasury account</p></div><div class="route"><div class="big">$250,000</div><div class="routebar"></div><span class="badge">✓ Settlement Successful</span><p style="margin-top:12px">PAPSS Cross-Border Route</p></div><div class="party"><h2>🇬🇭 Ghana Treasury</h2><p>Regional treasury account</p></div></div><div class="grid2" style="margin-top:20px"><div class="card pad"><h2>Compliance Timeline</h2>${['Payment Initiated','Compliance Screening','PAPSS Routing','Settlement Completed'].map(x=>`<div style="padding:15px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><span>✓ ${x}</span><span class="green">Completed</span></div>`).join('')}</div><div class="card pad"><h2>Settlement Summary</h2><div class="label" style="margin-top:25px">AMOUNT</div><div class="big">$250,000</div><div class="label">STATUS</div><div class="green" style="margin-top:8px">Successfully Settled</div></div></div>`)}
function supply(){layout(`<div class="pagehead"><div><h1>Supply Chain Finance</h1><p>Finance distributors and optimise working capital.</p></div><button class="btn" onclick="go('distributor')">View Distributor</button></div><div class="kpis">${[['ACTIVE DISTRIBUTORS','1,200','↑ 4%'],['PENDING INVOICES','₦28.6M','Awaiting approval'],['FINANCING UTILISATION','68%','↑ 8%'],['SETTLEMENT SUCCESS','97.8%','Regional average']].map(x=>`<div class="card kpi"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><span>${x[2]}</span></div>`).join('')}</div><div class="card pad"><h2>Invoice Queue</h2><table class="table"><thead><tr><th>Invoice ID</th><th>Distributor</th><th>Amount</th><th>Status</th></tr></thead><tbody><tr><td>INV-00482</td><td>AfriSnacks Ghana</td><td>₦4.8M</td><td><span class="badge pending">Pending</span></td></tr><tr><td>INV-00483</td><td>Nigeria Distributor</td><td>₦2.4M</td><td><span class="badge">Approved</span></td></tr><tr><td>INV-00484</td><td>Kenya Retail</td><td>₦3.1M</td><td><span class="badge pending">Pending</span></td></tr></tbody></table></div>`)}
function distributor(){layout(`<div class="pagehead"><div><h1>Distributor Profile</h1><p>Distributor financing and credit profile.</p></div></div><div class="card pad"><h2>AfriSnacks Ghana Distributor</h2><p style="margin-top:6px">Distributor ID: DIST-GHA-000489</p><p class="orange" style="margin-top:12px">● Eligible for Financing</p><div class="kpis" style="margin:25px 0 0">${[['CREDIT LIMIT','₦12M'],['OUTSTANDING INVOICE','₦4.8M'],['FINANCING OFFER','₦4.6M'],['STATUS','Active']].map(x=>`<div class="kpi" style="background:rgba(255,255,255,.04);border-radius:12px"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}</div></div><button class="btn" style="margin-top:24px" onclick="go('journey')">View Financing Journey →</button>`)}
function journey(){layout(`<div class="pagehead"><div><h1>Invoice Financing Journey</h1><p>End-to-end distributor financing workflow.</p></div></div><div class="card workflow">${[['✓','Onboard','done'],['✓','Invoice Uploaded','done'],['✓','Invoice Approved','done'],['4','Financing Generated','active'],['5','Settlement Completed','']].map((x,i)=>`<div class="step ${x[2]}"><div class="circle">${x[0]}</div><b>${x[1]}</b><p>${i<3?'Completed':i===3?'Active':'Pending'}</p></div>`).join('')}</div><button class="btn" style="margin-top:25px" onclick="go('impact')">View Treasury Impact →</button>`)}
function impact(){layout(`<div class="pagehead"><div><h1>Regional Treasury Successfully Updated</h1><p>Settlement and financing activity improved the regional treasury position.</p></div><span class="badge">✓ Update Complete</span></div><div class="impact"><div class="card impactcard"><div class="label">BEFORE</div><div class="big">$48.62M</div><p>Regional Liquidity</p></div><div class="arrow">↑<div style="font-size:15px">+$330K</div></div><div class="card impactcard"><div class="label">AFTER</div><div class="big green">$48.95M</div><p>Regional Liquidity</p></div></div><div class="grid2" style="margin-top:20px"><div class="card pad"><h2>Liquidity Improvement</h2>${forecast()}</div><div class="card pad"><h2>Latest Transaction</h2><p class="orange" style="margin-top:22px">● LIVE UPDATE</p><h2 style="margin-top:15px">Kenya Collection Received</h2><div class="big green" style="font-size:31px">₦1.8M</div><span class="badge">✓ Successfully Updated</span></div></div>`)}
function render(){({mission,cash,papss,supply,distributor,journey,impact})[current]()}render();
</script></body></html>
