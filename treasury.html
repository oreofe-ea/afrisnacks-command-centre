<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AfriSnacks Treasury Command Centre</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --midnight:#071523;
  --navy:#0B2344;
  --blue:#143B62;
  --blue2:#1C4D7C;
  --orange:#F58220;
  --green:#35C56A;
  --white:#FFFFFF;
  --slate:#C7D1DF;
  --muted:#93A4B8;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--midnight);
  color:white;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:255px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  background:var(--navy);
  border-right:1px solid rgba(255,255,255,.08);
  padding:25px 16px;
  z-index:10;
}

.brand{
  padding:8px 12px 35px;
}

.brand h2{
  font-size:22px;
}

.brand p{
  font-size:10px;
  color:var(--muted);
  margin-top:6px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.nav-btn{
  width:100%;
  border:none;
  background:transparent;
  color:#bdc9d8;
  padding:14px;
  margin-bottom:5px;
  border-radius:9px;
  cursor:pointer;
  text-align:left;
  font-size:14px;
}

.nav-btn:hover{
  background:rgba(255,255,255,.07);
}

.nav-btn.active{
  background:var(--blue);
  border-left:3px solid var(--orange);
  color:white;
}

.status-box{
  position:absolute;
  bottom:25px;
  left:18px;
  right:18px;
  padding:15px;
  background:rgba(255,255,255,.05);
  border-radius:10px;
  font-size:12px;
}

.status-box strong{
  display:block;
  margin-bottom:8px;
}

.online{
  color:var(--green);
}

/* MAIN */

.main{
  width:calc(100% - 255px);
  margin-left:255px;
}

.topbar{
  min-height:70px;
  padding:15px 35px;
  border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.topbar p{
  color:var(--slate);
  font-size:14px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--orange);
  color:var(--midnight);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.content{
  padding:35px;
  max-width:1550px;
}

/* GENERAL */

h1{
  font-size:36px;
  margin-bottom:10px;
}

h2{
  font-size:23px;
}

h3{
  font-size:16px;
}

p{
  color:var(--muted);
  line-height:1.6;
}

.label{
  color:var(--muted);
  font-size:12px;
  letter-spacing:.5px;
}

.green{
  color:var(--green);
}

.orange{
  color:var(--orange);
}

.card{
  background:#112842;
  border:1px solid rgba(255,255,255,.09);
  border-radius:18px;
  overflow:hidden;
}

.card-pad{
  padding:24px;
}

.btn{
  border:none;
  background:var(--orange);
  color:#071523;
  padding:13px 19px;
  border-radius:9px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

/* IMAGE VISUAL */

.page-visual{
  width:100%;
  height:220px;
  object-fit:cover;
  object-position:center;
  display:block;
  border-bottom:1px solid rgba(255,255,255,.08);
}

/* HERO */

.hero-grid{
  display:grid;
  grid-template-columns:1.5fr .9fr;
  gap:22px;
  margin-bottom:22px;
}

.hero-text{
  padding:35px;
}

.eyebrow{
  color:var(--orange);
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
}

.hero-text h1{
  font-size:42px;
  max-width:650px;
  margin:15px 0;
}

.hero-text p{
  font-size:16px;
}

.liquidity{
  padding:35px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.big-number{
  font-size:38px;
  font-weight:bold;
  margin:10px 0;
}

/* KPI */

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:22px;
}

.kpi{
  padding:22px;
}

.kpi-value{
  font-size:27px;
  font-weight:bold;
  margin:10px 0;
}

/* GRID */

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
  margin-top:22px;
}

/* CHART */

.chart-controls{
  display:flex;
  gap:8px;
  margin:15px 0 10px;
}

.chart-controls button{
  border:1px solid rgba(255,255,255,.12);
  background:#0c1d30;
  color:var(--slate);
  padding:8px 13px;
  border-radius:7px;
  cursor:pointer;
}

.chart-controls button.active{
  background:var(--orange);
  color:#071523;
  border-color:var(--orange);
}

.chart-box{
  height:310px;
  position:relative;
}

.chart-svg{
  width:100%;
  height:100%;
  overflow:visible;
}

.chart-grid line{
  stroke:rgba(255,255,255,.09);
  stroke-width:1;
}

.forecast-line{
  fill:none;
  stroke:var(--green);
  stroke-width:4;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.forecast-area{
  fill:url(#gradient);
  opacity:.45;
}

.chart-dot{
  fill:var(--orange);
  stroke:#fff;
  stroke-width:2;
}

.chart-labels{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}

/* BALANCES */

.balance-row{
  display:grid;
  grid-template-columns:90px 1fr 75px;
  gap:12px;
  align-items:center;
  margin:22px 0;
}

.bar{
  height:8px;
  background:rgba(255,255,255,.08);
  border-radius:10px;
  overflow:hidden;
}

.bar span{
  display:block;
  height:100%;
  background:var(--orange);
}

/* TABLE */

.table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

.table th,
.table td{
  text-align:left;
  padding:14px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.table th{
  color:var(--muted);
  font-size:11px;
}

.table td{
  color:var(--slate);
  font-size:13px;
}

.status{
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
}

.pending{
  color:var(--orange);
  background:rgba(245,130,32,.12);
}

.approved{
  color:var(--green);
  background:rgba(53,197,106,.12);
}

/* SETTLEMENT */

.settlement{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:25px;
  padding:25px;
  align-items:center;
}

.party{
  text-align:center;
  padding:30px;
  background:#0c1d30;
  border-radius:14px;
}

.route{
  text-align:center;
}

.route-line{
  height:4px;
  background:var(--orange);
  margin:20px 0;
  box-shadow:0 0 15px rgba(245,130,32,.7);
}

.success{
  display:inline-block;
  color:var(--green);
  background:rgba(53,197,106,.1);
  padding:8px 12px;
  border-radius:20px;
  font-size:12px;
}

/* PROFILE */

.profile{
  padding:30px;
}

.profile-head{
  display:flex;
  gap:20px;
  align-items:center;
}

.profile-icon{
  width:70px;
  height:70px;
  background:var(--blue);
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

.profile-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:28px;
}

.stat{
  padding:20px;
  background:#0c1d30;
  border-radius:12px;
}

.stat strong{
  display:block;
  margin-top:8px;
  font-size:20px;
}

/* WORKFLOW */

.workflow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:40px 20px;
}

.step{
  text-align:center;
  flex:1;
}

.circle{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
}

.completed .circle{
  background:var(--green);
  color:#071523;
}

.active .circle{
  background:var(--orange);
  color:#071523;
}

/* IMPACT */

.impact{
  display:grid;
  grid-template-columns:1fr 130px 1fr;
  gap:20px;
  align-items:center;
}

.impact-card{
  padding:35px;
  text-align:center;
}

.arrow{
  text-align:center;
  font-size:50px;
  color:var(--green);
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:950px){

  .sidebar{
    transform:translateX(-100%);
    transition:.3s;
  }

  .sidebar.show{
    transform:translateX(0);
  }

  .main{
    width:100%;
    margin-left:0;
  }

  .mobile-menu{
    display:block;
    background:transparent;
    border:none;
    color:white;
    font-size:24px;
  }

  .hero-grid,
  .two-col{
    grid-template-columns:1fr;
  }

  .kpi-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .settlement,
  .impact{
    grid-template-columns:1fr;
  }

  .profile-stats{
    grid-template-columns:repeat(2,1fr);
  }

  .workflow{
    overflow-x:auto;
    min-width:700px;
  }
}

@media(max-width:600px){

  .content{
    padding:20px;
  }

  .topbar{
    padding:15px 20px;
  }

  .topbar p{
    display:none;
  }

  h1{
    font-size:28px;
  }

  .hero-text h1{
    font-size:32px;
  }

  .kpi-grid{
    grid-template-columns:1fr;
  }

  .profile-stats{
    grid-template-columns:1fr;
  }

  .balance-row{
    grid-template-columns:75px 1fr 65px;
    font-size:12px;
  }

  .table{
    min-width:600px;
  }

  .table-wrap{
    overflow-x:auto;
  }
}

</style>
</head>

function createChart(days){

const values = days===7
? [48.2,48.7,48.4,49.1,48.8,49.5,49.0,49.7]
: [48.2,48.6,48.1,48.9,49.4,48.8,49.7,49.1,50.0,49.5,50.3,49.9,50.7,50.2,51.0,50.4,51.3,50.8,51.7,51.1,52.0,51.5,52.4,51.9,52.7,52.1,53.0,52.6,53.4,53.0];

const width=600;
const height=280;
const min=Math.min(...values)-1;
const max=Math.max(...values)+1;

const points=values.map((v,i)=>{

const x=(i/(values.length-1))*width;
const y=height-((v-min)/(max-min))*height;

return `${x.toFixed(1)},${y.toFixed(1)}`;

}).join(" ");

const area=`0,280 ${points} 600,280`;

return `

<svg class="chart-svg"
viewBox="0 0 600 280"
preserveAspectRatio="none">

<defs>

<linearGradient id="gradient"
x1="0" x2="0" y1="0" y2="1">

<stop offset="0%" stop-color="#35C56A" stop-opacity=".7"/>
<stop offset="100%" stop-color="#35C56A" stop-opacity="0"/>

</linearGradient>

</defs>

<g class="chart-grid">

<line x1="0" y1="40" x2="600" y2="40"/>
<line x1="0" y1="100" x2="600" y2="100"/>
<line x1="0" y1="160" x2="600" y2="160"/>
<line x1="0" y1="220" x2="600" y2="220"/>

</g>

<polygon class="forecast-area" points="${area}"></polygon>

<polyline class="forecast-line"
points="${points}"></polyline>

${values.map((v,i)=>{

const x=(i/(values.length-1))*width;
const y=height-((v-min)/(max-min))*height;

return `<circle class="chart-dot" cx="${x}" cy="${y}" r="4"></circle>`;

}).join("")}

</svg>

`;

}

function setForecast(days){
forecastPeriod=days;
cash();
}
