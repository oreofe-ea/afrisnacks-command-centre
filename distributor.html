<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AfriSnacks Supply Chain Finance Portal</title>
<style>
:root{--navy:#002A5C;--deep:#001C3D;--green:#247C42;--orange:#F58220;--bg:#F4F7FA;--ink:#16263B;--muted:#6B7280;--line:#DDE4EC;--white:#fff}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.side{width:250px;background:linear-gradient(180deg,#073D2A,#032B1E);height:100vh;position:fixed;padding:25px 14px;color:white}.logo{display:flex;gap:10px;align-items:center;margin:0 9px 30px}.logo-mark{width:38px;height:30px;border:3px solid #70B64B;border-radius:5px;position:relative}.logo-mark:before{content:"";position:absolute;width:10px;height:10px;border:3px solid #70B64B;border-bottom:0;border-radius:10px 10px 0 0;left:10px;top:-13px}.logo h2{font-size:15px}.logo p{font-size:10px;color:#B7D2C5;margin-top:3px}.nav{border:0;background:transparent;color:#D3E1DB;width:100%;padding:12px 14px;text-align:left;border-radius:7px;margin-bottom:4px;cursor:pointer}.nav:hover,.nav.active{background:#317243;color:white}.help{position:absolute;bottom:74px;left:15px;right:15px;background:#4E8B3A;padding:16px;border-radius:10px;font-size:12px}.logout{position:absolute;bottom:25px;left:25px;color:#D3E1DB;font-size:13px;cursor:pointer}.main{margin-left:250px;min-height:100vh}.top{height:72px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.bell{position:relative}.bell i{position:absolute;background:#D92626;color:white;border-radius:50%;font-size:9px;padding:3px;top:-9px;right:-10px}.profile{display:flex;gap:14px;align-items:center}.person{width:34px;height:34px;border-radius:50%;background:#245F43;color:white;display:grid;place-items:center}.content{padding:32px;max-width:1550px}h1{font-size:28px;margin-bottom:8px}h2{font-size:18px}h3{font-size:15px}p{color:var(--muted);line-height:1.55}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:0 6px 20px rgba(16,38,61,.04)}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.value{font-size:21px;font-weight:bold;margin:10px 0}.green{color:var(--green)}.orange{color:var(--orange)}.grid{display:grid;grid-template-columns:1.55fr .8fr;gap:18px;margin-top:18px}.progress{height:10px;background:#E7EBEF;border-radius:9px;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:var(--green);border-radius:9px}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:12px 8px;border-top:1px solid var(--line);font-size:12px;text-align:left}.table th{color:var(--muted)}.badge{padding:5px 9px;border-radius:20px;background:#E8F4EC;color:var(--green);font-size:10px}.btn{border:0;background:var(--green);color:white;padding:12px 18px;border-radius:7px;font-weight:bold;cursor:pointer}.btn.orangebtn{background:var(--orange);color:#13283B}.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:25px}.timeline .card{text-align:center}.num{width:30px;height:30px;border-radius:50%;border:2px solid var(--green);display:grid;place-items:center;color:var(--green);margin:0 auto 10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:7px;background:white}.empty{padding:40px;text-align:center}.menu{display:none}
@media(max-width:950px){.side{transform:translateX(-100%);transition:.25s;z-index:10}.side.open{transform:translateX(0)}.main{margin-left:0}.menu{display:block;border:1px solid var(--line);background:white;padding:8px;border-radius:6px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.help{display:none}}
@media(max-width:600px){.top{padding:0 16px}.content{padding:20px 14px}.cards,.formgrid{grid-template-columns:1fr}.pagehead{gap:10px;align-items:flex-start}.pagehead h1{font-size:24px}.profile span{display:none}.timeline{grid-template-columns:1fr 1fr}.table{font-size:11px}}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');const pages={dashboard:'Dashboard',profile:'My Profile',credit:'Credit Facility',order:'Place Order',orders:'Orders & Deliveries',repayments:'Repayments',invoices:'Invoices',statements:'Statements',support:'Support'};let current='dashboard';
function layout(content){app.innerHTML=`<aside class="side" id="side"><div class="logo"><div class="logo-mark"></div><div><h2>FMCG<br>SUPPLY CHAIN FINANCE</h2><p>Distributor / Retailer Portal</p></div></div>${Object.entries(pages).map(([k,v])=>`<button class="nav ${current===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}<div class="help"><b>Need Help?</b><br><span>Chat with us</span></div><div class="logout" onclick="alert('Prototype logout action')">⇥ Logout</div></aside><main class="main"><header class="top"><button class="menu" onclick="document.getElementById('side').classList.toggle('open')">☰</button><div style="margin-left:auto" class="profile"><div class="bell">♧<i>5</i></div><div class="person">JA</div><div><b style="font-size:13px">John Adewale</b><br><span style="font-size:11px;color:var(--muted)">Adewale Stores Ltd.</span></div></div></header><section class="content">${content}</section></main>`}
function go(p){current=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function dashboard(){layout(`<h1>Welcome back, John!</h1><p>Here's what's happening with your account.</p><div class="cards">${[['APPROVED CREDIT LIMIT','₦50,000,000.00',''],['AVAILABLE LIMIT','₦18,750,000.00','37.5% Available'],['OUTSTANDING BALANCE','₦31,250,000.00','View details →'],['TOTAL ORDERS (THIS MONTH)','₦24,560,000.00','5 Orders']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><p class="${x[2].includes('%')?'green':''}">${x[2]}</p></div>`).join('')}</div><div class="grid"><div class="card"><h2>Credit Utilisation</h2><p>You have used 62.5% of your credit limit.</p><div class="progress"><span style="width:62.5%"></span></div><div style="display:flex;justify-content:space-between;font-size:11px"><span>₦31,250,000 used</span><span>₦18,750,000 available</span></div></div><div class="card"><h2>Next Repayment</h2><div class="value green">₦4,250,000.00</div><p>Due on Sep 30, 2026</p><button class="btn" style="margin-top:12px" onclick="go('repayments')">Make Repayment</button></div></div><div class="grid"><div class="card"><h2>Recent Orders</h2><table class="table"><thead><tr><th>Order</th><th>Date</th><th>Status</th><th>Amount</th></tr></thead><tbody><tr><td>ORD-2026-006</td><td>Sep 24</td><td><span class="badge">Delivered</span></td><td>₦4.25M</td></tr><tr><td>ORD-2026-005</td><td>Sep 21</td><td><span class="badge">In Transit</span></td><td>₦3.75M</td></tr><tr><td>ORD-2026-004</td><td>Sep 18</td><td><span class="badge">Delivered</span></td><td>₦5.60M</td></tr></tbody></table></div><div class="card"><h2>Repayment Schedule</h2><table class="table"><thead><tr><th>Matched Order</th><th>Repayment</th><th>Status</th></tr></thead><tbody><tr><td>ORD-2026-004<br><small>Paid in 7 days</small></td><td>₦5.60M</td><td><span class="badge">Paid</span></td></tr><tr><td>ORD-2026-003<br><small>Paid in 9 days</small></td><td>₦6.35M</td><td><span class="badge">Paid</span></td></tr><tr><td>ORD-2026-006</td><td>₦4.25M</td><td>Upcoming</td></tr></tbody></table></div></div><div class="card" style="margin-top:18px"><h2>How It Works</h2><div class="timeline">${[['1','Choose Products'],['2','Get Financed'],['3','Receive & Sell'],['4','Repay Easily']].map(x=>`<div><div class="num">${x[0]}</div><b style="font-size:12px">${x[1]}</b></div>`).join('')}</div></div>`)}
function profile(){layout(`<div class="pagehead"><div><h1>My Profile</h1><p>Manage your business and account information.</p></div><button class="btn">Save Changes</button></div><div class="grid"><div class="card"><h2>Adewale Stores Ltd.</h2><div class="formgrid"><div><label>Contact Name</label><input value="John Adewale"></div><div><label>Phone Number</label><input value="+234 803 000 0000"></div><div><label>Email</label><input value="john@adewalestores.com"></div><div><label>Business Location</label><input value="Lagos, Nigeria"></div></div></div><div class="card"><h2>Account Status</h2><div class="value green">Verified</div><p>KYC and distributor onboarding successfully completed.</p></div></div>`)}
function credit(){layout(`<div class="pagehead"><div><h1>Credit Facility</h1><p>View your facility, utilisation and available funding.</p></div></div><div class="cards">${[['APPROVED LIMIT','₦50,000,000',''],['USED FACILITY','₦31,250,000','62.5% utilised'],['AVAILABLE LIMIT','₦18,750,000','Ready to support new orders'],['NEXT REVIEW','Aug 30, 2026','']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><p>${x[2]}</p></div>`).join('')}</div><div class="card"><h2>Facility Utilisation</h2><div class="progress"><span style="width:62.5%"></span></div><p>Keep repayments timely to maintain strong facility availability.</p></div>`)}
function order(){layout(`<div class="pagehead"><div><h1>Place Order</h1><p>Create a new stock order and request financing.</p></div><button class="btn orangebtn" onclick="alert('Order submitted for prototype review')">Submit Order</button></div><div class="card"><div class="formgrid"><div><label>Product Category</label><select><option>Chin Chin</option><option>Biscuits</option><option>Peanuts</option><option>Potato Chips</option><option>Plantain Chips</option></select></div><div><label>Order Value</label><input value="₦4,250,000"></div><div><label>Requested Delivery Date</label><input type="date" value="2026-06-02"></div><div><label>Financing Option</label><select><option>Use Available Credit</option><option>Self Financing</option></select></div></div></div><div class="card" style="margin-top:18px"><h2>Order Summary</h2><p style="margin-top:10px">Financing is subject to available credit and order approval.</p></div>`)}
function orders(){layout(`<div class="pagehead"><div><h1>Orders & Deliveries</h1><p>Track current and completed AfriSnacks orders.</p></div><button class="btn" onclick="go('order')">Place New Order</button></div><div class="card"><table class="table"><thead><tr><th>Order</th><th>Date</th><th>Delivery</th><th>Amount</th><th>Repayment Link</th></tr></thead><tbody><tr><td>ORD-2026-006</td><td>Sep 24</td><td><span class="badge">Delivered</span></td><td>₦4.25M</td><td>Upcoming</td></tr><tr><td>ORD-2026-005</td><td>Sep 21</td><td><span class="badge">In Transit</span></td><td>₦3.75M</td><td>Pending delivery</td></tr><tr><td>ORD-2026-004</td><td>Sep 18</td><td><span class="badge">Delivered</span></td><td>₦5.60M</td><td class="green">Paid in 7 days</td></tr><tr><td>ORD-2026-003</td><td>Sep 15</td><td><span class="badge">Delivered</span></td><td>₦6.35M</td><td class="green">Paid in 9 days</td></tr></tbody></table></div>`)}
function repayments(){layout(`<div class="pagehead"><div><h1>Repayments</h1><p>Repayments are matched directly to financed orders.</p></div><button class="btn">Make Repayment</button></div><div class="cards">${[['PAID THIS MONTH','₦11,950,000',''],['AVERAGE REPAYMENT TIME','8 DAYS','Within 10-day target'],['UPCOMING','₦4,250,000','ORD-2026-006'],['ON-TIME RATE','100%','']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value ${x[1].includes('DAYS')?'green':''}">${x[1]}</div><p>${x[2]}</p></div>`).join('')}</div><div class="card"><h2>Order-Matched Repayment Schedule</h2><table class="table"><thead><tr><th>Order</th><th>Order Date</th><th>Repayment Date</th><th>Amount</th><th>Time Taken</th><th>Status</th></tr></thead><tbody><tr><td>ORD-2026-004</td><td>Sep 18</td><td>Sep 25</td><td>₦5.60M</td><td class="green">7 days</td><td><span class="badge">Paid</span></td></tr><tr><td>ORD-2026-003</td><td>Sep 15</td><td>Sep 24</td><td>₦6.35M</td><td class="green">9 days</td><td><span class="badge">Paid</span></td></tr><tr><td>ORD-2026-006</td><td>Sep 24</td><td>Sep 30</td><td>₦4.25M</td><td>Due in 6 days</td><td>Upcoming</td></tr></tbody></table></div>`)}
function invoices(){layout(`<div class="pagehead"><div><h1>Invoices</h1><p>Review invoices generated for financed and completed orders.</p></div></div><div class="card"><table class="table"><thead><tr><th>Invoice</th><th>Order</th><th>Amount</th><th>Due Date</th><th>Status</th></tr></thead><tbody><tr><td>INV-2026-206</td><td>ORD-2026-006</td><td>₦4.25M</td><td>Sep 30</td><td>Open</td></tr><tr><td>INV-2026-204</td><td>ORD-2026-004</td><td>₦5.60M</td><td>Sep 25</td><td><span class="badge">Paid</span></td></tr><tr><td>INV-2026-203</td><td>ORD-2026-003</td><td>₦6.35M</td><td>Sep 24</td><td><span class="badge">Paid</span></td></tr></tbody></table></div>`)}
function statements(){layout(`<div class="pagehead"><div><h1>Statements</h1><p>Account activity and facility movement.</p></div><button class="btn">Download Statement</button></div><div class="card"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody><tr><td>Sep 25</td><td>Repayment: ORD-2026-004</td><td>₦5.60M</td><td>-</td><td>₦31.25M</td></tr><tr><td>Sep 24</td><td>Financing: ORD-2026-006</td><td>-</td><td>₦4.25M</td><td>₦36.85M</td></tr><tr><td>Sep 24</td><td>Repayment: ORD-2026-003</td><td>₦6.35M</td><td>-</td><td>₦32.60M</td></tr></tbody></table></div>`)}
function support(){layout(`<div class="pagehead"><div><h1>Support</h1><p>Get help with orders, financing or repayments.</p></div></div><div class="grid"><div class="card"><h2>Send a Support Request</h2><div class="formgrid"><div><label>Topic</label><select><option>Order & Delivery</option><option>Credit Facility</option><option>Repayment</option></select></div><div><label>Priority</label><select><option>Normal</option><option>Urgent</option></select></div></div><textarea style="width:100%;height:120px;margin-top:15px;padding:12px;border:1px solid var(--line);border-radius:7px" placeholder="Describe your request"></textarea><br><button class="btn" style="margin-top:12px">Submit Request</button></div><div class="card"><h2>Need immediate help?</h2><p style="margin-top:12px">Our supply chain finance support team is available to assist with account and transaction enquiries.</p><div class="value green" style="font-size:16px">Chat with Support</div></div></div>`)}
function render(){({dashboard,profile,credit,order,orders,repayments,invoices,statements,support})[current]()}render();
</script></body></html>
