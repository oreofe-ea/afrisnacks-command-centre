<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AfriSnacks Digital Command Centre</title>

<style>

/* =========================================
   AFRISNACKS DIGITAL COMMAND CENTRE
   DESIGN SYSTEM
========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --midnight: #041322;
  --royal: #0B2344;
  --deep: #143B62;
  --orange: #F58220;
  --green: #22C55E;
  --white: #FFFFFF;
  --slate: #CBD5E1;
  --muted: #94A3B8;
  --dark: #020B16;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--midnight);
  color: var(--white);
  min-height: 100vh;
}

/* APP */

.app {
  display: flex;
  min-height: 100vh;
}

/* SIDEBAR */

.sidebar {
  width: 260px;
  background: var(--royal);
  border-right: 1px solid rgba(255,255,255,0.08);
  padding: 28px 18px;
  position: fixed;
  height: 100vh;
}

.brand {
  margin-bottom: 45px;
}

.brand h2 {
  font-size: 20px;
  margin-bottom: 6px;
}

.brand p {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nav-btn {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--slate);
  text-align: left;
  cursor: pointer;
  font-size: 14px;
}

.nav-btn:hover {
  background: rgba(255,255,255,0.06);
}

.nav-btn.active {
  background: var(--deep);
  color: var(--white);
  border-left: 3px solid var(--orange);
}

.system-status {
  position: absolute;
  bottom: 30px;
  left: 20px;
  right: 20px;
  background: rgba(255,255,255,0.04);
  padding: 15px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
}

.system-status strong {
  color: var(--white);
  display: block;
  margin-bottom: 8px;
}

/* MAIN */

.main {
  margin-left: 260px;
  width: calc(100% - 260px);
  min-height: 100vh;
}

.topbar {
  height: 75px;
  padding: 0 35px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(4,19,34,0.85);
}

.topbar-title {
  font-size: 14px;
  color: var(--slate);
}

.user {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--orange);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--midnight);
  font-weight: bold;
}

.content {
  padding: 40px;
}

/* TYPOGRAPHY */

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

h2 {
  font-size: 24px;
}

h3 {
  font-size: 16px;
}

p {
  color: var(--muted);
  line-height: 1.6;
}

.label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}

/* BUTTON */

.btn {
  background: var(--orange);
  color: var(--midnight);
  border: none;
  padding: 13px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.btn:hover {
  opacity: 0.9;
}

/* CARD */

.card {
  background: rgba(11,35,68,0.75);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(2,11,22,0.3);
}

.card-pad {
  padding: 24px;
}

/* GRIDS */

.hero-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 25px;
  margin-bottom: 25px;
}

.hero {
  padding: 45px;
  min-height: 300px;
  background:
    radial-gradient(circle at top right, rgba(20,59,98,0.8), transparent 45%),
    var(--royal);
}

.hero h1 {
  font-size: 46px;
  max-width: 600px;
  margin: 20px 0;
}

.hero p {
  font-size: 17px;
}

.eyebrow {
  color: var(--orange);
  font-size: 13px;
  font-weight: bold;
}

.liquidity {
  padding: 35px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.big-number {
  font-size: 42px;
  font-weight: bold;
  margin: 12px 0;
}

.green {
  color: var(--green);
}

.orange {
  color: var(--orange);
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 25px;
}

.kpi {
  padding: 22px;
}

.kpi .value {
  font-size: 25px;
  font-weight: bold;
  margin: 10px 0;
}

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 22px;
}

.feature-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 25px;
}

.feature {
  padding: 30px;
}

.feature-icon {
  width: 55px;
  height: 55px;
  background: rgba(245,130,32,0.12);
  border: 1px solid rgba(245,130,32,0.4);
  color: var(--orange);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  font-size: 24px;
  margin-bottom: 20px;
}

.feature h2 {
  margin-bottom: 12px;
}

.feature .btn {
  margin-top: 25px;
}

.tag {
  display: inline-block;
  padding: 7px 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  font-size: 11px;
  color: var(--slate);
  margin: 15px 5px 0 0;
}

/* PAGE HEADER */

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

/* BALANCES */

.balance-row {
  display: grid;
  grid-template-columns: 90px 1fr 80px;
  gap: 15px;
  align-items: center;
  margin: 20px 0;
  color: var(--slate);
}

.bar {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--orange);
  border-radius: 20px;
}

/* CHART */

.chart {
  height: 280px;
  margin-top: 20px;
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background:
    linear-gradient(transparent 95%, rgba(255,255,255,0.05) 95%);
}

.chart-line {
  position: absolute;
  left: 5%;
  right: 5%;
  bottom: 20%;
  height: 3px;
  background: var(--green);
  transform: rotate(-4deg);
  box-shadow: 0 0 15px rgba(34,197,94,0.5);
}

/* FEED */

.feed-item {
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  justify-content: space-between;
  color: var(--slate);
}

/* TABLE */

.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

.table th {
  text-align: left;
  color: var(--muted);
  font-size: 12px;
  padding: 14px;
}

.table td {
  padding: 15px 14px;
  border-top: 1px solid rgba(255,255,255,0.07);
  color: var(--slate);
  font-size: 13px;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
}

.status.pending {
  color: var(--orange);
  background: rgba(245,130,32,0.1);
}

.status.approved {
  color: var(--green);
  background: rgba(34,197,94,0.1);
}

/* SETTLEMENT */

.settlement {
  padding: 40px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  gap: 30px;
}

.party {
  padding: 25px;
  text-align: center;
}

.route-center {
  text-align: center;
}

.payment-route {
  height: 4px;
  background: var(--orange);
  margin: 20px 0;
  box-shadow: 0 0 20px rgba(245,130,32,0.7);
}

.success-badge {
  display: inline-block;
  background: rgba(34,197,94,0.12);
  color: var(--green);
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 12px;
}

/* PROFILE */

.profile {
  padding: 35px;
}

.profile-top {
  display: flex;
  gap: 20px;
  align-items: center;
  margin-bottom: 30px;
}

.profile-icon {
  width: 70px;
  height: 70px;
  border-radius: 16px;
  background: var(--deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.profile-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.profile-stat {
  padding: 20px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
}

.profile-stat strong {
  font-size: 20px;
  display: block;
  margin-top: 8px;
}

/* WORKFLOW */

.workflow {
  padding: 45px 25px;
  display: flex;
  justify-content: space-between;
  position: relative;
}

.workflow::before {
  content: "";
  position: absolute;
  top: 70px;
  left: 10%;
  right: 10%;
  height: 2px;
  background: rgba(255,255,255,0.1);
}

.step {
  width: 18%;
  text-align: center;
  position: relative;
  z-index: 2;
}

.step-circle {
  width: 48px;
  height: 48px;
  margin: auto auto 15px;
  border-radius: 50%;
  background: var(--deep);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}

.step.completed .step-circle {
  background: var(--green);
  color: var(--midnight);
}

.step.active .step-circle {
  background: var(--orange);
  color: var(--midnight);
}

/* IMPACT */

.impact {
  display: grid;
  grid-template-columns: 1fr 150px 1fr;
  gap: 20px;
  align-items: center;
}

.impact-card {
  padding: 35px;
  text-align: center;
}

.impact-arrow {
  text-align: center;
  font-size: 55px;
  color: var(--green);
}

/* RESPONSIVE */

@media(max-width: 1000px) {

  .sidebar {
    width: 210px;
  }

  .main {
    margin-left: 210px;
    width: calc(100% - 210px);
  }

  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .hero-grid,
  .feature-grid,
  .two-col {
    grid-template-columns: 1fr;
  }

  .profile-stats {
    grid-template-columns: repeat(2, 1fr);
  }
}

</style>
</head>

<body>

<div id="app"></div>

      <section class="content">

}

function goTo(page) {
