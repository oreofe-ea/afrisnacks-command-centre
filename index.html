<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AfriSnacks Digital Command Centre</title>

<style>

/* =====================================================
   AFRISNACKS DIGITAL COMMAND CENTRE
   ALL-IN-ONE INDEX.HTML
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --midnight: #061421;
    --navy: #0B2344;
    --blue: #143B62;
    --card: #102842;
    --orange: #F58220;
    --orange-light: #ff9d4d;
    --green: #31D17C;
    --red: #ff657c;
    --white: #FFFFFF;
    --text: #D7E2EC;
    --muted: #96A8B9;
    --border: rgba(255,255,255,0.09);
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--midnight);
    color: var(--white);
    min-height: 100vh;
}

button {
    font-family: inherit;
}

/* =====================================================
   APP LAYOUT
===================================================== */

.app {
    display: flex;
    min-height: 100vh;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    width: 260px;
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    background: var(--navy);
    padding: 28px 18px;
    border-right: 1px solid var(--border);
    z-index: 100;
}

.brand {
    margin-bottom: 40px;
}

.brand h2 {
    font-size: 23px;
}

.brand p {
    margin-top: 5px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.nav-btn {
    display: block;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--text);
    padding: 14px 16px;
    margin-bottom: 7px;
    border-radius: 9px;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    transition: 0.25s ease;
}

.nav-btn:hover {
    background: rgba(255,255,255,0.07);
    transform: translateX(3px);
}

.nav-btn.active {
    background: var(--blue);
    color: white;
    border-left: 4px solid var(--orange);
}

.system-status {
    position: absolute;
    bottom: 28px;
    left: 18px;
    right: 18px;
    padding: 15px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    font-size: 12px;
}

.system-status strong {
    display: block;
    margin-bottom: 8px;
}

.online {
    color: var(--green);
}

/* =====================================================
   MAIN
===================================================== */

.main {
    margin-left: 260px;
    width: calc(100% - 260px);
    min-height: 100vh;
}

.topbar {
    height: 75px;
    padding: 0 35px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(6,20,33,0.96);
    position: sticky;
    top: 0;
    z-index: 50;
}

.topbar-title {
    font-size: 14px;
    color: var(--muted);
}

.user {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--orange);
    color: var(--midnight);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* =====================================================
   CONTENT
===================================================== */

.content {
    padding: 38px;
    position: relative;
    min-height: calc(100vh - 75px);
}

/*
   SUBTLE IMAGE VISUAL

   The uploaded PNG is NOT displayed as a dashboard
   inside another dashboard.

   It is used only as a faint page atmosphere.
*/

.page-image {
    position: absolute;
    top: 0;
    right: 0;
    width: 600px;
    height: 500px;

    background-size: cover;
    background-position: center;

    opacity: 0.025;

    pointer-events: none;

    mask-image:
        linear-gradient(
            to bottom left,
            black,
            transparent 75%
        );

    -webkit-mask-image:
        linear-gradient(
            to bottom left,
            black,
            transparent 75%
        );
}

.page-content {
    position: relative;
    z-index: 2;
}

/* =====================================================
   TYPOGRAPHY
===================================================== */

h1 {
    font-size: 35px;
    margin-bottom: 10px;
}

h2 {
    font-size: 23px;
}

h3 {
    font-size: 17px;
}

p {
    color: var(--muted);
    line-height: 1.6;
}

.label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
}

.eyebrow {
    color: var(--orange);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

.green {
    color: var(--green);
}

.orange {
    color: var(--orange);
}

.red {
    color: var(--red);
}

/* =====================================================
   BUTTONS
===================================================== */

.btn {
    border: none;
    background: var(--orange);
    color: var(--midnight);
    padding: 14px 21px;
    border-radius: 9px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s ease;
}

.btn:hover {
    transform: translateY(-2px);
    background: var(--orange-light);
}

.btn.secondary {
    background: rgba(255,255,255,0.07);
    color: white;
    border: 1px solid var(--border);
}

/* =====================================================
   CARDS
===================================================== */

.card {
    background: rgba(16,40,66,0.98);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.card-pad {
    padding: 26px;
}

/* =====================================================
   HERO
===================================================== */

.hero-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
}

.hero {
    padding: 45px;
    min-height: 300px;
    background:
        radial-gradient(
            circle at top right,
            rgba(245,130,32,0.14),
            transparent 42%
        ),
        linear-gradient(135deg,#102842,#0B2344);
}

.hero h1 {
    font-size: 47px;
    max-width: 650px;
    margin: 18px 0;
}

.hero p {
    font-size: 17px;
}

.hero-actions {
    display: flex;
    gap: 12px;
    margin-top: 28px;
}

.liquidity {
    padding: 35px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.big-number {
    font-size: 42px;
    font-weight: bold;
    margin: 12px 0;
}

/* =====================================================
   KPI
===================================================== */

.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 18px;
    margin-bottom: 24px;
}

.kpi {
    padding: 24px;
    cursor: pointer;
    transition: 0.25s ease;
}

.kpi:hover {
    transform: translateY(-5px);
    border-color: rgba(245,130,32,0.5);
}

.kpi .value {
    font-size: 28px;
    font-weight: bold;
    margin: 14px 0;
}

/* =====================================================
   GRIDS
===================================================== */

.two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.feature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.feature {
    padding: 30px;
}

.feature-icon {
    width: 56px;
    height: 56px;
    background: rgba(245,130,32,0.12);
    border: 1px solid rgba(245,130,32,0.35);
    color: var(--orange);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    margin-bottom: 20px;
}

.tag {
    display: inline-block;
    padding: 7px 11px;
    margin: 18px 5px 0 0;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-size: 11px;
}

/* =====================================================
   PAGE HEADER
===================================================== */

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
}

/* =====================================================
   CHART
===================================================== */

.chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.chart-tabs {
    display: flex;
    gap: 6px;
}

.chart-tab {
    border: none;
    padding: 7px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
}

.chart-tab.active {
    background: var(--orange);
    color: var(--midnight);
}

.chart-wrapper {
    position: relative;
    margin-top: 20px;
    height: 330px;
}

.chart-wrapper svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

.grid-line {
    stroke: rgba(255,255,255,0.1);
    stroke-width: 1;
}

.chart-area {
    fill: rgba(49,209,124,0.12);
}

.chart-line {
    fill: none;
    stroke: var(--green);
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 7px rgba(49,209,124,0.7));
}

.chart-point {
    fill: var(--midnight);
    stroke: var(--green);
    stroke-width: 4;
    cursor: pointer;
}

.chart-point:hover {
    fill: var(--orange);
    stroke: var(--orange);
}

.axis-label {
    fill: var(--muted);
    font-size: 11px;
}

.chart-tooltip {
    position: absolute;
    display: none;
    background: #07111d;
    border: 1px solid var(--border);
    padding: 8px 12px;
    border-radius: 7px;
    font-size: 12px;
    pointer-events: none;
    z-index: 20;
}

/* =====================================================
   BALANCES
===================================================== */

.balance-row {
    display: grid;
    grid-template-columns: 90px 1fr 80px;
    gap: 14px;
    align-items: center;
    margin: 21px 0;
}

.bar {
    height: 9px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: hidden;
}

.bar span {
    display: block;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        var(--orange),
        var(--orange-light)
    );
}

/* =====================================================
   TABLE
===================================================== */

.table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

.table th {
    text-align: left;
    color: var(--muted);
    font-size: 11px;
    padding: 14px;
}

.table td {
    padding: 16px 14px;
    border-top: 1px solid rgba(255,255,255,0.07);
    color: var(--text);
    font-size: 13px;
}

.status {
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
}

.pending {
    color: var(--orange);
    background: rgba(245,130,32,0.12);
}

.approved {
    color: var(--green);
    background: rgba(49,209,124,0.12);
}

.action-btn {
    border: none;
    background: rgba(49,209,124,0.12);
    color: var(--green);
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
}

/* =====================================================
   PAPSS
===================================================== */

.settlement {
    padding: 40px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 30px;
    align-items: center;
}

.party {
    padding: 28px;
    text-align: center;
}

.route-center {
    text-align: center;
}

.payment-route {
    height: 6px;
    margin: 25px 0;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        var(--orange),
        var(--green),
        var(--orange)
    );
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% {
        box-shadow: 0 0 24px rgba(245,130,32,0.8);
    }
}

.success-badge {
    display: inline-block;
    padding: 9px 14px;
    border-radius: 20px;
    color: var(--green);
    background: rgba(49,209,124,0.12);
    font-size: 12px;
}

/* =====================================================
   FEED
===================================================== */

.feed-item {
    padding: 17px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex;
    justify-content: space-between;
}

/* =====================================================
   PROFILE
===================================================== */

.profile {
    padding: 35px;
}

.profile-top {
    display: flex;
    gap: 20px;
    align-items: center;
    margin-bottom: 30px;
}

.profile-icon {
    width: 70px;
    height: 70px;
    border-radius: 17px;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
}

.profile-stats {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
}

.profile-stat {
    padding: 20px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
}

.profile-stat strong {
    display: block;
    margin-top: 8px;
    font-size: 20px;
}

/* =====================================================
   WORKFLOW
===================================================== */

.workflow {
    padding: 45px 25px;
    display: flex;
    justify-content: space-between;
    position: relative;
}

.workflow::before {
    content: "";
    position: absolute;
    top: 69px;
    left: 10%;
    right: 10%;
    height: 2px;
    background: rgba(255,255,255,0.12);
}

.step {
    width: 18%;
    text-align: center;
    position: relative;
    z-index: 2;
}

.step-circle {
    width: 50px;
    height: 50px;
    margin: auto auto 14px;
    border-radius: 50%;
    background: var(--blue);
    display: flex;
    align-items: center;
    justify-content: center;
}

.step.completed .step-circle {
    background: var(--green);
    color: var(--midnight);
}

.step.active .step-circle {
    background: var(--orange);
    color: var(--midnight);
}

/* =====================================================
   IMPACT
===================================================== */

.impact {
    display: grid;
    grid-template-columns: 1fr 150px 1fr;
    align-items: center;
    gap: 20px;
}

.impact-card {
    padding: 35px;
    text-align: center;
}

.impact-arrow {
    text-align: center;
    font-size: 55px;
    color: var(--green);
}

/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 450px;
    max-width: 90%;
    padding: 30px;
    border-radius: 18px;
    background: #0D243B;
    border: 1px solid var(--border);
}

.modal-box h2 {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color: white;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 25px;
}

/* =====================================================
   TOAST
===================================================== */

.toast {
    position: fixed;
    right: 25px;
    bottom: 25px;
    padding: 15px 20px;
    border-radius: 9px;
    background: var(--green);
    color: var(--midnight);
    font-weight: bold;
    transform: translateY(100px);
    opacity: 0;
    transition: 0.35s ease;
    z-index: 1000;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width: 1050px) {

    .sidebar {
        width: 210px;
    }

    .main {
        margin-left: 210px;
        width: calc(100% - 210px);
    }

    .kpi-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .hero-grid,
    .two-col,
    .feature-grid {
        grid-template-columns: 1fr;
    }

    .profile-stats {
        grid-template-columns: repeat(2,1fr);
    }

    .settlement {
        grid-template-columns: 1fr;
    }

}

@media(max-width: 700px) {

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
        width: 100%;
    }

    .content {
        padding: 22px;
    }

    .topbar {
        padding: 0 20px;
    }

    .kpi-grid {
        grid-template-columns: 1fr;
    }

    .hero {
        padding: 30px;
    }

    .hero h1 {
        font-size: 34px;
    }

    .profile-stats {
        grid-template-columns: 1fr;
    }

    .workflow {
        flex-direction: column;
        gap: 25px;
    }

    .workflow::before {
        display: none;
    }

    .step {
        width: 100%;
    }

    .impact {
        grid-template-columns: 1fr;
    }

}

</style>
</head>

<body>

<div id="app"></div>

<div class="modal" id="paymentModal">

    <div class="modal-box">

        <h2>Create Payment</h2>

        <div class="form-group">
            <label>Destination Region</label>
            <select>
                <option>Ghana</option>
                <option>Kenya</option>
                <option>Nigeria</option>
                <option>Rwanda</option>
            </select>
        </div>

        <div class="form-group">
            <label>Payment Amount</label>
            <input type="text" placeholder="$250,000">
        </div>

        <div class="modal-actions">

            <button
                class="btn secondary"
                onclick="closePayment()"
            >
                Cancel
            </button>

            <button
                class="btn"
                onclick="submitPayment()"
            >
                Submit Payment
            </button>

        </div>

    </div>

</div>

<div class="toast" id="toast">
    Action completed successfully.
</div>


<script>

/* =====================================================
   DATA
===================================================== */

const app = document.getElementById("app");

const pages = {

    mission: "Mission Control",
    cash: "Cash Management",
    papss: "PAPSS Settlement",
    supply: "Supply Chain Finance",
    distributor: "Distributor Profile",
    journey: "Financing Journey",
    impact: "Treasury Impact"

};

let currentPage = "mission";


/* =====================================================
   LAYOUT
===================================================== */

function renderLayout(content, imageName = "") {

    app.innerHTML = `

        <div class="app">

            <aside class="sidebar">

                <div class="brand">
                    <h2>AfriSnacks</h2>
                    <p>Digital Command Centre</p>
                </div>

                ${Object.entries(pages).map(([id,name]) => `

                    <button
                        class="nav-btn ${currentPage === id ? "active" : ""}"
                        onclick="goTo('${id}')"
                    >
                        ${name}
                    </button>

                `).join("")}

                <div class="system-status">

                    <strong>● System Status</strong>

                    <span class="online">
                        All Systems Operational
                    </span>

                </div>

            </aside>


            <main class="main">

                <header class="topbar">

                    <div class="topbar-title">
                        AfriSnacks Digital Command Centre
                    </div>

                    <div class="user">

                        <span>Executive Treasury</span>

                        <div class="avatar">
                            AT
                        </div>

                    </div>

                </header>


                <section class="content">

                    <div
                        class="page-image"
                        style="background-image:url('${imageName}')"
                    ></div>

                    <div class="page-content">

                        ${content}

                    </div>

                </section>

            </main>

        </div>

    `;

}


function goTo(page) {

    currentPage = page;

    render();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   MISSION CONTROL
===================================================== */

function missionPage() {

renderLayout(`

<div class="hero-grid">

    <div class="card hero">

        <div class="eyebrow">
            AFRICA-WIDE TREASURY VISIBILITY
        </div>

        <h1>
            Run Africa from One Command Centre.
        </h1>

        <p>
            Real-time visibility, smarter liquidity
            and stronger supply chains across
            AfriSnacks' regional operations.
        </p>

        <div class="hero-actions">

            <button
                class="btn"
                onclick="goTo('cash')"
            >
                Explore Treasury →
            </button>

            <button
                class="btn secondary"
                onclick="goTo('papss')"
            >
                View PAPSS
            </button>

        </div>

    </div>


    <div class="card liquidity">

        <div class="label">
            TOTAL LIQUIDITY
        </div>

        <div class="big-number green">
            $48.62M
        </div>

        <p>
            Available across all regional accounts
        </p>

        <p
            class="green"
            style="margin-top:15px"
        >
            ↑ 3.61% vs yesterday
        </p>

    </div>

</div>


<div class="kpi-grid">

    <div
        class="card kpi"
        onclick="goTo('cash')"
    >
        <div class="label">COLLECTIONS TODAY</div>
        <div class="value">₦18.2M</div>
        <span class="green">↑ 12.4%</span>
    </div>


    <div
        class="card kpi"
        onclick="goTo('papss')"
    >
        <div class="label">PAPSS SETTLEMENT</div>
        <div class="value green">Active</div>
        <span>Real-time settlement</span>
    </div>


    <div
        class="card kpi"
        onclick="goTo('supply')"
    >
        <div class="label">DISTRIBUTOR NETWORK</div>
        <div class="value">1,200</div>
        <span>Active distributors</span>
    </div>


    <div class="card kpi">

        <div class="label">CURRENCIES</div>

        <div class="value">12</div>

        <span>Supported currencies</span>

    </div>

</div>


<div class="feature-grid">

    <div class="card feature">

        <div class="feature-icon">▣</div>

        <h2>Cash Management</h2>

        <p style="margin-top:12px">
            Optimise liquidity, collections
            and regional cash positions.
        </p>

        <span class="tag">Liquidity</span>
        <span class="tag">Collections</span>
        <span class="tag">Forecasting</span>

/* =====================================================
   INTERACTIONS
===================================================== */

function openPayment() {

    document
        .getElementById("paymentModal")
        .classList.add("show");

}

function closePayment() {

    document
        .getElementById("paymentModal")
        .classList.remove("show");

}

function submitPayment() {

    closePayment();

    showToast(
        "Payment submitted for approval."
    );

}


function showToast(message) {

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 3000);

}


function approveInvoice(id) {

    const row =
        document.getElementById(id);

    row.querySelector(
        "td:nth-child(4)"
    ).innerHTML = `
        <span class="status approved">
            Approved
        </span>
    `;

    row.querySelector(
        "td:nth-child(5)"
    ).innerHTML = "✓";

    showToast(
        "Invoice approved successfully."
    );

}


function completeJourney() {

    showToast(
        "Financing journey completed successfully."
    );

    setTimeout(() => {

        goTo("impact");

    }, 900);

}


function changeChart(button, period) {

    document
        .querySelectorAll(".chart-tab")
        .forEach(tab => {

            tab.classList.remove("active");

        });

    button.classList.add("active");

    if (period === "month") {

        showToast(
            "30-day liquidity forecast selected."
        );

    }

}


/* =====================================================
   CHART TOOLTIP
===================================================== */

function showTooltip(event) {

    const tooltip =
        document.getElementById("chartTooltip");

    if (!tooltip) return;

    tooltip.innerHTML =
        event.target.dataset.value;

    tooltip.style.display = "block";

    tooltip.style.left =
        event.offsetX + 20 + "px";

    tooltip.style.top =
        event.offsetY + "px";

}


function hideTooltip() {

    const tooltip =
        document.getElementById("chartTooltip");

    if (tooltip) {

        tooltip.style.display = "none";

    }

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    if (currentPage === "mission") {
        missionPage();
    }

    if (currentPage === "cash") {
        cashPage();
    }

    if (currentPage === "papss") {
        papssPage();
    }

    if (currentPage === "supply") {
        supplyPage();
    }

    if (currentPage === "distributor") {
        distributorPage();
    }

    if (currentPage === "journey") {
        journeyPage();
    }

    if (currentPage === "impact") {
        impactPage();
    }

}


render();

</script>
