<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AfriSnacks Digital Command Centre</title>

<style>

/* =========================================
   AFRISNACKS DIGITAL COMMAND CENTRE
   DESIGN SYSTEM
========================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --midnight: #041322;
  --royal: #0B2344;
  --deep: #143B62;
  --orange: #F58220;
  --green: #22C55E;
  --white: #FFFFFF;
  --slate: #CBD5E1;
  --muted: #94A3B8;
  --dark: #020B16;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--midnight);
  color: var(--white);
  min-height: 100vh;
}

.app {
  display: flex;
  min-height: 100vh;
}

/* =========================================
   SIDEBAR
========================================= */

.sidebar {
  width: 260px;
  background: var(--royal);
  border-right: 1px solid rgba(255,255,255,0.08);
  padding: 28px 18px;
  position: fixed;
  height: 100vh;
  z-index: 10;
}

.brand {
  margin-bottom: 45px;
}

.brand h2 {
  font-size: 20px;
  margin-bottom: 6px;
}

.brand p {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nav-btn {
  width: 100%;
  padding: 14px 16px;
  margin-bottom: 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--slate);
  text-align: left;
  cursor: pointer;
  font-size: 14px;
  transition: 0.2s ease;
}

.nav-btn:hover {
  background: rgba(255,255,255,0.06);
  color: var(--white);
}

.nav-btn.active {
  background: var(--deep);
  color: var(--white);
  border-left: 3px solid var(--orange);
}

.system-status {
  position: absolute;
  bottom: 30px;
  left: 20px;
  right: 20px;
  background: rgba(255,255,255,0.04);
  padding: 15px;
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
}

.system-status strong {
  color: var(--white);
  display: block;
  margin-bottom: 8px;
}

/* =========================================
   MAIN
========================================= */

.main {
  margin-left: 260px;
  width: calc(100% - 260px);
  min-height: 100vh;
}

.topbar {
  height: 75px;
  padding: 0 35px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: rgba(4,19,34,0.92);
  position: sticky;
  top: 0;
  z-index: 5;
}

.topbar-title {
  font-size: 14px;
  color: var(--slate);
}

.user {
  display: flex;
  align-items: center;
  gap: 12px;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--orange);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--midnight);
  font-weight: bold;
}

.content {
  padding: 40px;
}

/* =========================================
   TYPOGRAPHY
========================================= */

h1 {
  font-size: 32px;
  margin-bottom: 10px;
}

h2 {
  font-size: 24px;
}

h3 {
  font-size: 16px;
}

p {
  color: var(--muted);
  line-height: 1.6;
}

.label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
}

/* =========================================
   BUTTON
========================================= */

.btn {
  background: var(--orange);
  color: var(--midnight);
  border: none;
  padding: 13px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s ease;
}

.btn:hover {
  opacity: 0.9;
  transform: translateY(-1px);
}

/* =========================================
   CARD
========================================= */

.card {
  background: rgba(11,35,68,0.75);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(2,11,22,0.3);
  overflow: hidden;
}

.card-pad {
  padding: 24px;
}

/* =========================================
   IMAGE SYSTEM
========================================= */

.image-wrap {
  width: 100%;
  overflow: hidden;
  border-radius: 14px;
  background: var(--deep);
}

.image-wrap img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.dashboard-image {
  width: 100%;
  display: block;
  border-radius: 12px;
  object-fit: cover;
}

.hero-image {
  height: 100%;
  min-height: 300px;
  object-fit: cover;
}

.section-image {
  height: 250px;
}

.small-image {
  height: 180px;
}

/* =========================================
   HERO
========================================= */

.hero-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 25px;
  margin-bottom: 25px;
}

.hero {
  min-height: 300px;
  padding: 0;
  background:
    radial-gradient(circle at top right, rgba(20,59,98,0.8), transparent 45%),
    var(--royal);
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
}

.hero-copy {
  padding: 45px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero h1 {
  font-size: 46px;
  max-width: 600px;
  margin: 20px 0;
}

.hero p {
  font-size: 17px;
}

.hero-visual {
  min-height: 300px;
  padding: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-visual img {
  width: 100%;
  height: 100%;
  max-height: 330px;
  object-fit: cover;
  border-radius: 12px;
}

.eyebrow {
  color: var(--orange);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 0.5px;
}

.liquidity {
  padding: 35px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.big-number {
  font-size: 42px;
  font-weight: bold;
  margin: 12px 0;
}

.green {
  color: var(--green);
}

.orange {
  color: var(--orange);
}

/* =========================================
   KPI
========================================= */

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 25px;
}

.kpi {
  padding: 22px;
}

.kpi .value {
  font-size: 25px;
  font-weight: bold;
  margin: 10px 0;
}

/* =========================================
   GRIDS
========================================= */

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 22px;
}

.feature-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 25px;
}

.feature {
  padding: 30px;
}

.feature-icon {
  width: 55px;
  height: 55px;
  background: rgba(245,130,32,0.12);
  border: 1px solid rgba(245,130,32,0.4);
  color: var(--orange);
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 14px;
  font-size: 24px;
  margin-bottom: 20px;
}

.feature h2 {
  margin-bottom: 12px;
}

.feature .btn {
  margin-top: 25px;
}

.tag {
  display: inline-block;
  padding: 7px 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  font-size: 11px;
  color: var(--slate);
  margin: 15px 5px 0 0;
}

/* =========================================
   PAGE HEADER
========================================= */

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}

/* =========================================
   IMAGE + TEXT PANELS
========================================= */

.visual-panel {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-top: 22px;
}

.visual-panel .card {
  padding: 20px;
}

.visual-panel h3 {
  margin-bottom: 15px;
}

.map-panel {
  min-height: 300px;
}

.map-panel img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 12px;
}

/* =========================================
   BALANCES
========================================= */

.balance-row {
  display: grid;
  grid-template-columns: 90px 1fr 80px;
  gap: 15px;
  align-items: center;
  margin: 20px 0;
  color: var(--slate);
}

.bar {
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  overflow: hidden;
}

.bar span {
  display: block;
  height: 100%;
  background: var(--orange);
  border-radius: 20px;
}

/* =========================================
   CHART
========================================= */

.chart {
  height: 280px;
  margin-top: 20px;
  position: relative;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background:
    linear-gradient(
      transparent 95%,
      rgba(255,255,255,0.05) 95%
    );
}

.chart-line {
  position: absolute;
  left: 5%;
  right: 5%;
  bottom: 20%;
  height: 3px;
  background: var(--green);
  transform: rotate(-4deg);
  box-shadow: 0 0 15px rgba(34,197,94,0.5);
}

/* =========================================
   FEED
========================================= */

.feed-item {
  padding: 16px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  justify-content: space-between;
  color: var(--slate);
}

/* =========================================
   TABLE
========================================= */

.table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

.table th {
  text-align: left;
  color: var(--muted);
  font-size: 12px;
  padding: 14px;
}

.table td {
  padding: 15px 14px;
  border-top: 1px solid rgba(255,255,255,0.07);
  color: var(--slate);
  font-size: 13px;
}

.status {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 11px;
}

.status.pending {
  color: var(--orange);
  background: rgba(245,130,32,0.1);
}

.status.approved {
  color: var(--green);
  background: rgba(34,197,94,0.1);
}

/* =========================================
   SETTLEMENT
========================================= */

.settlement {
  padding: 40px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  align-items: center;
  gap: 30px;
}

.party {
  padding: 25px;
  text-align: center;
}

.party-image {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 15px;
}

.route-center {
  text-align: center;
}

.payment-route {
  height: 4px;
  background: var(--orange);
  margin: 20px 0;
  box-shadow: 0 0 20px rgba(245,130,32,0.7);
}

.success-badge {
  display: inline-block;
  background: rgba(34,197,94,0.12);
  color: var(--green);
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 12px;
}

/* =========================================
   PROFILE
========================================= */

.profile {
  padding: 35px;
}

.profile-top {
  display: flex;
  gap: 20px;
  align-items: center;
  margin-bottom: 30px;
}

.profile-icon {
  width: 70px;
  height: 70px;
  border-radius: 16px;
  background: var(--deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  overflow: hidden;
}

.profile-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.profile-stat {
  padding: 20px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
}

.profile-stat strong {
  font-size: 20px;
  display: block;
  margin-top: 8px;
}

/* =========================================
   WORKFLOW
========================================= */

.workflow {
  padding: 45px 25px;
  display: flex;
  justify-content: space-between;
  position: relative;
}

.workflow::before {
  content: "";
  position: absolute;
  top: 70px;
  left: 10%;
  right: 10%;
  height: 2px;
  background: rgba(255,255,255,0.1);
}

.step {
  width: 18%;
  text-align: center;
  position: relative;
  z-index: 2;
}

.step-circle {
  width: 48px;
  height: 48px;
  margin: auto auto 15px;
  border-radius: 50%;
  background: var(--deep);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
}

.step.completed .step-circle {
  background: var(--green);
  color: var(--midnight);
}

.step.active .step-circle {
  background: var(--orange);
  color: var(--midnight);
}

/* =========================================
   IMPACT
========================================= */

.impact {
  display: grid;
  grid-template-columns: 1fr 150px 1fr;
  gap: 20px;
  align-items: center;
}

.impact-card {
  padding: 35px;
  text-align: center;
}

.impact-arrow {
  text-align: center;
  font-size: 55px;
  color: var(--green);
}

/* =========================================
   FOOTER IMAGE
========================================= */

.impact-visual {
  margin-top: 25px;
  display: grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap: 22px;
}

.impact-visual img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 14px;
}

/* =========================================
   RESPONSIVE
========================================= */

@media(max-width: 1200px) {

  .hero {
    grid-template-columns: 1fr;
  }

  .hero-visual {
    min-height: 240px;
  }

  .hero-image {
    min-height: 220px;
  }

  .visual-panel,
  .impact-visual {
    grid-template-columns: 1fr;
  }
}

@media(max-width: 1000px) {

  .sidebar {
    width: 210px;
  }

  .main {
    margin-left: 210px;
    width: calc(100% - 210px);
  }

  .kpi-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .hero-grid,
  .feature-grid,
  .two-col {
    grid-template-columns: 1fr;
  }

  .profile-stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .settlement {
    grid-template-columns: 1fr;
  }

  .impact {
    grid-template-columns: 1fr;
  }

  .impact-arrow {
    transform: rotate(90deg);
  }
}

@media(max-width: 700px) {

  .sidebar {
    position: relative;
    width: 100%;
    height: auto;
  }

  .system-status {
    position: relative;
    left: auto;
    right: auto;
    bottom: auto;
    margin-top: 25px;
  }

  .app {
    display: block;
  }

  .main {
    margin-left: 0;
    width: 100%;
  }

  .topbar {
    padding: 0 20px;
  }

  .content {
    padding: 20px;
  }

  .kpi-grid,
  .profile-stats {
    grid-template-columns: 1fr;
  }

  .hero-copy {
    padding: 30px;
  }

  .hero h1 {
    font-size: 34px;
  }

  .workflow {
    flex-direction: column;
    gap: 30px;
  }

  .workflow::before {
    display: none;
  }

  .step {
    width: 100%;
  }

  .table {
    min-width: 600px;
  }

  .card.card-pad {
    overflow-x: auto;
  }
}

</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================
   AFRISNACKS PROTOTYPE
========================================= */

const app = document.getElementById("app");

const pages = {
  mission: "Mission Control",
  cash: "Cash Management",
  papss: "PAPSS Settlement",
  supply: "Supply Chain Finance",
  distributor: "Distributor Profile",
  journey: "Financing Journey",
  impact: "Treasury Impact"
};

let currentPage = "mission";


/* =========================================
   LAYOUT
========================================= */

function renderLayout(content) {

  app.innerHTML = `

  <div class="app">

    <aside class="sidebar">

      <div class="brand">
        <h2>AfriSnacks</h2>
        <p>Digital Command Centre</p>
      </div>

      ${Object.entries(pages).map(([id, name]) => `
        <button
          class="nav-btn ${currentPage === id ? "active" : ""}"
          onclick="goTo('${id}')"
        >
          ${name}
        </button>
      `).join("")}

      <div class="system-status">
        <strong>● System Status</strong>
        <span class="green">All Systems Operational</span>
      </div>

    </aside>

    <main class="main">

      <header class="topbar">

        <div class="topbar-title">
          AfriSnacks Digital Command Centre
        </div>

        <div class="user">
          <span>Executive Treasury</span>
          <div class="avatar">AT</div>
        </div>

      </header>

      <section class="content">
        ${content}
      </section>

    </main>

  </div>
  `;
}


function goTo(page) {
  currentPage = page;
  render();
}


/* =========================================
   MISSION CONTROL
========================================= */

function missionPage() {

  renderLayout(`

    <div class="hero-grid">

      <div class="card hero">

        <div class="hero-copy">

          <div class="eyebrow">
            AFRICA-WIDE TREASURY VISIBILITY
          </div>

          <h1>
            Run Africa from One Command Centre.
          </h1>

          <p>
            Real-time visibility. Smarter liquidity.
            Stronger supply chains.
          </p>

          <button
            class="btn"
            style="margin-top:25px"
            onclick="goTo('cash')"
          >
            Explore Treasury →
          </button>

        </div>

        <div class="hero-visual">
          <img
            src="mission-control.png"
            alt="AfriSnacks Digital Command Centre"
          >
        </div>

      </div>


      <div class="card liquidity">

        <div class="label">TOTAL LIQUIDITY</div>

        <div class="big-number green">
          $48.62M
        </div>

        <p>
          Available across all regional accounts
        </p>

        <p class="green" style="margin-top:15px">
          ↑ 3.61% vs yesterday
        </p>

      </div>

    </div>


    <div class="kpi-grid">

      <div class="card kpi">
        <div class="label">COLLECTIONS TODAY</div>
        <div class="value">₦18.2M</div>
        <span class="green">↑ 12.4%</span>
      </div>

      <div class="card kpi">
        <div class="label">PAPSS SETTLEMENT</div>
        <div class="value green">Active</div>
        <span>Real-time settlement</span>
      </div>

      <div class="card kpi">
        <div class="label">DISTRIBUTOR NETWORK</div>
        <div class="value">1,200</div>
        <span>Active distributors</span>
      </div>

      <div class="card kpi">
        <div class="label">CURRENCIES</div>
        <div class="value">12</div>
        <span>Supported currencies</span>
      </div>

    </div>


    <div class="visual-panel">

      <div class="card card-pad map-panel">

        <h3>Regional Treasury Coverage</h3>

        <p style="margin:8px 0 15px">
          One view across AfriSnacks' African operating markets.
        </p>

        <img
          src="africa-map.png"
          alt="AfriSnacks Africa regional treasury map"
        >

      </div>


      <div class="card card-pad">

        <h3>Command Centre Intelligence</h3>

        <p style="margin:8px 0 20px">
          Integrated visibility across liquidity,
          collections, settlement and supply chain finance.
        </p>

        <div class="feed-item">
          <span>Liquidity Position</span>
          <span class="green">Healthy</span>
        </div>

        <div class="feed-item">
          <span>Cross-Border Settlement</span>
          <span class="green">Active</span>
        </div>

        <div class="feed-item">
          <span>Distributor Financing</span>
          <span class="orange">68% Utilised</span>
        </div>

        <div class="feed-item">
          <span>Regional Collections</span>
          <span class="green">On Track</span>
        </div>

      </div>

    </div>


    <div class="feature-grid">

      <div class="card feature">

        <div class="feature-icon">▣</div>

        <h2>Cash Management</h2>

        <p>
          Optimise liquidity, collections
          and regional cash positions.
        </p>

        <span class="tag">Liquidity</span>
        <span class="tag">Collections</span>
        <span class="tag">Forecasting</span>

        <br>

        <button
          class="btn"
          onclick="goTo('cash')"
        >
          Open Cash Management →
        </button>

      </div>


      <div class="card feature">

        <div class="feature-icon">▱</div>

        <h2>Supply Chain Finance</h2>

        <p>
          Empower distributors and unlock
          working capital across Africa.
        </p>

        <span class="tag">Invoices</span>
        <span class="tag">Financing</span>
        <span class="tag">Settlement</span>

        <br>

        <button
          class="btn"
          onclick="goTo('supply')"
        >
          Open Supply Chain Finance →
        </button>

      </div>

    </div>

  `);
}


/* =========================================
   CASH MANAGEMENT
========================================= */

function cashPage() {

  renderLayout(`

    <div class="page-header">

      <div>
        <h1>Cash Management</h1>
        <p>
          Real-time liquidity and collections intelligence.
        </p>
      </div>

      <button class="btn">Create Payment</button>

    </div>


    <div class="kpi-grid">

      <div class="card kpi">
        <div class="label">LIQUIDITY</div>
        <div class="value green">$48.62M</div>
        <span class="green">↑ 3.61%</span>
      </div>

      <div class="card kpi">
        <div class="label">COLLECTIONS</div>
        <div class="value">₦18.2M</div>
        <span class="green">↑ 12.4%</span>
      </div>

      <div class="card kpi">
        <div class="label">CASH CONCENTRATION</div>
        <div class="value">82%</div>
        <span class="green">↑ 5%</span>
      </div>

      <div class="card kpi">
        <div class="label">REGIONS</div>
        <div class="value">5</div>
        <span>Active markets</span>
      </div>

    </div>


    <div class="card card-pad">

      <h3>Cash Management Solution</h3>
